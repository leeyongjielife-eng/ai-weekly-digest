name: Knowledge Base Site Update

on:
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy the committed static site without refreshing Gmail
        type: boolean
        default: false
  workflow_run:
    workflows: ["AI Weekly Digest"]
    types: [completed]
    branches: [main]
  schedule:
    # 17:17 Monday Asia/Shanghai == 09:17 Monday UTC; fallback for missed workflow_run events
    - cron: "17 9 * * 1"

concurrency:
  group: knowledge-base-site-update
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    # Manual digest runs send test mail and should not update the public site.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore private runtime files
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
        run: |
          test -n '${{ secrets.GOOGLE_API_KEY }}${{ secrets.OPENAI_API_KEY }}${{ secrets.DEEPSEEK_API_KEY }}'
          mkdir -p knowledge_base/secrets knowledge_base/data/private
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test -n '${{ secrets.KB_GMAIL_CREDENTIALS_JSON }}'
            test -n '${{ secrets.KB_GMAIL_TOKEN_JSON }}'
            printf '%s' '${{ secrets.KB_GMAIL_CREDENTIALS_JSON }}' > knowledge_base/secrets/gmail-readonly-credentials.json
            printf '%s' '${{ secrets.KB_GMAIL_TOKEN_JSON }}' > knowledge_base/secrets/gmail-readonly-token.json
          fi
          cat > knowledge_base/secrets/summary.env <<EOF
          AI_SUMMARY_PROVIDER=auto
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          EOF

      - name: Download sent digest articles
        if: github.event_name == 'workflow_run' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            digest_run_id='${{ github.event.workflow_run.id }}'
          else
            week_start="$(date -u -d 'monday this week' +%Y-%m-%dT00:00:00Z)"
            digest_run_id="$(gh run list \
              --workflow ai-digest.yml \
              --event schedule \
              --status success \
              --limit 10 \
              --json databaseId,createdAt \
              | jq -r --arg cutoff "$week_start" '.[] | select(.createdAt >= $cutoff) | .databaseId' \
              | head -n 1)"
          fi
          test -n "$digest_run_id"
          gh run download "$digest_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name digest-articles \
            --dir knowledge_base/data/private/digest-articles

      - name: Seed SQLite from public article snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
        run: |
          printf '{}\n' > knowledge_base/data/test-articles.meta.json
          python -B knowledge_base/scripts/import_articles_json.py --data knowledge_base/data/articles.export.json --replace

      - name: Run scheduled update
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_only != true }}
        run: python -B knowledge_base/scripts/run_scheduled_update.py --provider auto

      - name: Update from sent digest
        if: github.event_name == 'workflow_run' || github.event_name == 'schedule'
        run: >-
          python -B knowledge_base/scripts/update_from_digest.py
          --input knowledge_base/data/private/digest-articles/knowledge_base-input.json
          --provider auto

      - name: Validate updated data and site
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
        run: |
          python -B knowledge_base/tests/test_article_data.py --data knowledge_base/data/articles.export.json
          python -B knowledge_base/tests/test_static_site.py --data knowledge_base/data/articles.export.json
          python -B knowledge_base/tests/test_scheduled_update.py
          python -B knowledge_base/tests/test_incremental_update.py

      - name: Validate committed static site
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_only == true }}
        run: |
          printf '{}\n' > knowledge_base/data/test-articles.meta.json
          python -B knowledge_base/tests/test_article_data.py --data knowledge_base/data/articles.export.json
          python -B knowledge_base/tests/test_static_site.py --data knowledge_base/data/articles.export.json

      - name: Commit updated public site artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge_base/data/articles.export.json knowledge_base/site
          if git diff --cached --quiet; then
            echo "No public site changes to commit."
          else
            git commit -m "chore: update knowledge base site"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: knowledge_base/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload update status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-update-status
          path: |
            knowledge_base/data/private/last-scheduled-update.json
            knowledge_base/data/private/last-incremental-update.json
            knowledge_base/data/private/scheduled-update.log
          if-no-files-found: ignore
          retention-days: 14
